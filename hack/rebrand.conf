# rebrand.conf — kubernetes-ingress-controller @ v3.2.4 (single-repo)
# Consumed by hack/rebrand-core.sh and hack/rebrand-test.sh.
#
# KIC v3.2.4 predates the kubernetes-configuration module split: the CRD Go
# types are IN THIS REPO (pkg/apis/**), so this is a single-repo rebrand — no
# go.mod repoint. Only two CRD groups exist at this version.
#
# Discover groups with:
#   grep -rhoE '\+groupName=[A-Za-z0-9.-]+' --include='*.go' pkg/apis | sort -u

REBRAND_PAIRS=(
  "configuration.konghq.com=configuration.acceldata.io"
  "incubator.ingress-controller.konghq.com=incubator.ingress-controller.acceldata.io"
)

# CRD manifests live in two dirs (controller-gen writes configuration -> bases,
# incubator -> incubator). Both must be listed so the <group>_*.yaml file RENAMES
# happen in each. (Token rewriting is repo-wide and independent of this list.)
CRD_DIRS=(
  "config/crd/bases"
  "config/crd/incubator"
)

# NOT touched by the engine (bare `konghq.com` or non-group substrings — the
# fixed-string replace of the two exact group tokens never matches them):
KEEP=(
  "kubernetes.io/ingress.class / ingressClassName            (routing identity, not a CRD group)"
  "konghq.com/* data-plane annotations (plugins, protocol...) (read by the Kong proxy)"
  "konghq.com/kic-gateway-controller GatewayClass name        (controller identity)"
  "*.validation.ingress-controller.konghq.com webhook names   (webhook identity, not a group)"
  "5b374a9e.konghq.com / *.konghq.com election-id             (leader-election identity)"
  "Go module path github.com/kong/kubernetes-ingress-controller/v3 (unchanged)"
)
