# permissions for end users to view kongingresses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kongingress-viewer-role
rules:
- apiGroups:
  - configuration.acceldata.io
  resources:
  - kongingresses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - configuration.acceldata.io
  resources:
  - kongingresses/status
  verbs:
  - get
