name: "validate Kong image (targeted)"
run-name: "validate Kong ${{ format('{0}:{1}', github.event.inputs.kong-image-repo, github.event.inputs.kong-image-tag) }}"

on:
  workflow_dispatch:
    inputs:
      kong-image-repo:
        description: Kong Gateway Docker image to test with (repository). Must be an EE variant.
        type: string
        required: true
        default: "kong/kong-gateway"
      kong-image-tag:
        description: Kong Gateway Docker image to test with (tag).
        type: string
        required: true
        default: "latest"
      kong-effective-version:
        description: Effective semantic version of Kong Gateway Docker image. If not given, the semantic version will be parsed from the image tag.
        type: string
        required: false
      e2e-controller-image-repo:
        description: KIC Docker image for E2E tests (repository).
        type: string
        required: true
        default: "kong/kubernetes-ingress-controller"
      e2e-controller-image-tag:
        description: KIC Docker image for E2E tests (tag).
        type: string
        required: true
        default: "latest"
      issue-number:
        description: Issue number to comment in, and close in case of success. Can be none.
        type: string
        required: false
      distroless-image:
        description: |-
          Whether the image is a distroless image.
          This controls whether the tests need to adjust settings for distroless images.
          If set to true, no lifecycle hooks will be used and stale pids will not be cleared.
        type: boolean
        required: false
        default: false
      send-slack-notification:
        description: Whether to send the result of the validation tests to Slack.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  startup-issue-comment:
    timeout-minutes: ${{ fromJSON(vars.GHA_DEFAULT_TIMEOUT) }}
    if: ${{ github.event.inputs.issue-number != '' }}
    runs-on: ubuntu-latest
    env:
      # URL is the current workflow's run URL.
      # Sadly this is not readily available in github's context.
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_NUMBER: ${{ github.event.inputs.issue-number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      # Short-lived App token, minted in the job that uses it.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kubernetes-ingress-controller
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - env:
          EVENT_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            'Kong Gateway validation tests were started at '"$URL"' with the following parameters:
            ```json
            '"$EVENT_INPUTS_JSON"'
            ```
            '

  run-e2e-tests:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_e2e_tests.yaml
    secrets: inherit
    with:
      distroless-image: ${{ fromJSON(github.event.inputs.distroless-image) }}
      kic-image: ${{ format('{0}:{1}', github.event.inputs.e2e-controller-image-repo, github.event.inputs.e2e-controller-image-tag) }}
      kong-image: ${{ format('{0}:{1}', github.event.inputs.kong-image-repo, github.event.inputs.kong-image-tag) }}
      kong-effective-version: ${{ github.event.inputs.kong-effective-version }}
      load-local-image: false
      run-gke: true
      run-istio: true
      all-supported-k8s-versions: true

  run-integration-tests:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_integration_tests.yaml
    secrets: inherit
    with:
      distroless-image: ${{ fromJSON(github.event.inputs.distroless-image) }}
      kong-container-repo: ${{ github.event.inputs.kong-image-repo }}
      kong-container-tag: ${{ github.event.inputs.kong-image-tag }}
      kong-oss-effective-version: ${{ github.event.inputs.kong-effective-version }}
      # We're passing the same image twice, because the integration tests need to know the image
      # for Enterprise variant of tests separately.
      # That makes this workflow usable only for Enterprise images.
      kong-enterprise-container-repo: ${{ github.event.inputs.kong-image-repo }}
      kong-enterprise-container-tag: ${{ github.event.inputs.kong-image-tag }}
      kong-enterprise-effective-version: ${{ github.event.inputs.kong-effective-version }}
      log-output-file:  /tmp/integration-tests-kic-logs

  on-finish-comment-or-close-issue:
    timeout-minutes: ${{ fromJSON(vars.GHA_DEFAULT_TIMEOUT) }}
    needs:
    - startup-issue-comment
    - run-e2e-tests
    - run-integration-tests
    if: ${{ always() && github.event.inputs.issue-number != '' }}
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_NUMBER: ${{ github.event.inputs.issue-number }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      # Short-lived App token, minted in the job that uses it.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.GH_APP__KONG_K8S__APP_ID }}
          private-key: ${{ secrets.GH_APP__KONG_K8S__PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            kubernetes-ingress-controller
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          EVENT_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue close "$ISSUE_NUMBER" --comment \
            'Kong Gateway validation tests **PASSED** ✅ at '"$URL"' with the following parameters:
            ```json
            '"$EVENT_INPUTS_JSON"'
            ```
            '
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          EVENT_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body \
            'Kong Gateway validation tests **FAILED** ❌ at '"$URL"' with the following parameters:
            ```json
            '"$EVENT_INPUTS_JSON"'
            ```
            '

  notify-on-slack:
    timeout-minutes: ${{ fromJSON(vars.GHA_DEFAULT_TIMEOUT) }}
    needs:
    - run-e2e-tests
    - run-integration-tests
    if: ${{ !cancelled() && github.event.inputs.send-slack-notification == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - name: Notify on Slack with the result of the validation tests
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KONG_IMAGE: ${{ format('{0}:{1}', github.event.inputs.kong-image-repo, github.event.inputs.kong-image-tag) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [[ "${FAILED}" == "true" ]]; then
            text=":red_circle: Image validation tests for Kong gateway image \`${KONG_IMAGE}\` failed: <${RUN_URL}|workflow run>"
          else
            text=":white_check_mark: Image validation tests for Kong gateway image \`${KONG_IMAGE}\` passed: <${RUN_URL}|workflow run>"
          fi
          payload=$(jq -n --arg text "${text}" '{text: $text}')
          curl -fsS -X POST -H 'Content-type: application/json' --data "${payload}" "${SLACK_WEBHOOK_URL}"
